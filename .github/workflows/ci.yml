# Continuous integration: vet, race-enabled tests, module verification,
# and dependency vulnerability scanning on every push and pull request.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Tests (race detector)
        run: go test -race ./...

      - name: Module verification
        run: go mod verify

      - name: Vulnerability scan
        # @latest keeps the scanner's vuln DB fresh; matches `make vuln`.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
